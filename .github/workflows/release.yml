name: Release

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'samples/**'
  workflow_dispatch:

concurrency:
  group: release-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        # Pin: actions/checkout v4 (major version)
        uses: actions/checkout@v4

      - name: Setup Node.js
        # Pin: actions/setup-node v4 (major version)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run unit tests
        run: npm test

      - name: Compute version & verify tag
        id: ver
        shell: bash
        run: |
          BASE=$(node -p "require('./package.json').version.split('.').slice(0,2).join('.')")
          V="$BASE.${{ github.run_number }}"
          echo "Computed release version: $V"

          # Verify that this tag does not already exist on remote
          if git ls-remote --exit-code --tags origin "refs/tags/v$V" >/dev/null 2>&1; then
            echo "::error::Tag v$V already exists on origin. Refusing to overwrite. Trigger a new workflow run instead of re-running an old job."
            exit 1
          fi

          # Update version in package.json for electron-builder without committing back to git
          npm pkg set version="$V"
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Build Desktop SPA bundle
        run: npm run build:desktop

      - name: Build MCP server bundle
        run: npm run mcp:build

      - name: Package Windows Installer
        shell: bash
        run: |
          if [ -n "${CSC_LINK_SECRET}" ]; then
            echo "Certificate link detected; configuring code signing."
            export CSC_LINK="${CSC_LINK_SECRET}"
            export CSC_KEY_PASSWORD="${CSC_KEY_PASSWORD_SECRET}"
          else
            echo "No code signing certificate supplied; packaging unsigned installer."
          fi
          npx electron-builder --win --publish never
        env:
          CSC_LINK_SECRET: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD_SECRET: ${{ secrets.CSC_KEY_PASSWORD }}

      - name: Upload installer artifact
        # Pin: actions/upload-artifact v4 (major version)
        uses: actions/upload-artifact@v4
        with:
          name: installer-${{ steps.ver.outputs.version }}
          path: |
            release/Mindgraph-Setup-*.exe
            release/latest.yml
            release/*.blockmap
            mcp/dist/mindgraph-mcp.mjs
          retention-days: 7

      - name: Publish GitHub Release
        # Pin: softprops/action-gh-release v2 (major version)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Mindgraph v${{ steps.ver.outputs.version }}
          generate_release_notes: true
          make_latest: true
          fail_on_unmatched_files: true
          files: |
            release/Mindgraph-Setup-*.exe
            release/latest.yml
            release/*.blockmap
            mcp/dist/mindgraph-mcp.mjs
