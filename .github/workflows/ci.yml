name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Lint, Test, and Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        # Pin: actions/checkout v4 (major version)
        uses: actions/checkout@v4

      - name: Setup Node.js
        # Pin: actions/setup-node v4 (major version)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run unit tests
        run: npm test

      - name: Build Web PWA bundle
        run: npm run build

      - name: Build Desktop SPA bundle
        run: npm run build:desktop
