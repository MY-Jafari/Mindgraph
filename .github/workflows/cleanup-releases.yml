name: Cleanup Old Releases

on:
  schedule:
    # Run every Sunday at 03:00 UTC
    - cron: '0 3 * * 0'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    name: Prune Releases (Keep Newest 30)
    runs-on: ubuntu-latest
    steps:
      - name: Prune old releases and tags
        # Pin: actions/github-script v7 (major version)
        uses: actions/github-script@v7
        with:
          script: |
            const KEEP_COUNT = 30;
            const { owner, repo } = context.repo;

            const releases = await github.paginate(github.rest.repos.listReleases, {
              owner,
              repo,
              per_page: 100,
            });

            console.log(`Found ${releases.length} total releases.`);

            // Sort releases descending by creation date
            releases.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));

            // Exclude latest/prerelease if needed, keep newest 30
            const releasesToPrune = releases.slice(KEEP_COUNT).filter(r => !r.latest);
            console.log(`Identified ${releasesToPrune.length} releases older than top ${KEEP_COUNT} to prune.`);

            for (const release of releasesToPrune) {
              console.log(`Deleting release ${release.name} (ID: ${release.id}, tag: ${release.tag_name})...`);
              try {
                await github.rest.repos.deleteRelease({
                  owner,
                  repo,
                  release_id: release.id,
                });
                // Delete corresponding git tag
                await github.rest.git.deleteRef({
                  owner,
                  repo,
                  ref: `tags/${release.tag_name}`,
                });
                console.log(`Deleted release and tag ${release.tag_name}`);
              } catch (err) {
                console.error(`Error deleting ${release.tag_name}:`, err.message);
              }
            }
